# =============================================================================
# wazuh-waha.service.d/notify.conf - Drop-in para OnFailure= de wazuh-waha
# =============================================================================
# Mismo patron que wazuh-agent: agrega OnFailure= sin pisar override.conf.
#
# Instalacion:
#   sudo cp deploy/arch-host/wazuh-waha.service.d-notify.conf \\
#          /etc/systemd/system/wazuh-waha.service.d/notify.conf
#   sudo systemctl daemon-reload
# =============================================================================

[Unit]
OnFailure=wazuh-waha-failure-notify.service