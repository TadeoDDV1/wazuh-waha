# =============================================================================
# wazuh-agent.service.d/notify.conf - Drop-in para OnFailure= de wazuh-agent
# =============================================================================
# Este drop-in agrega OnFailure= al unit base de wazuh-agent SIN pisar
# override.conf (que puede tener Restart= o flags propias del operador).
#
# Instalacion:
#   sudo cp deploy/arch-host/wazuh-agent.service.d-notify.conf \\
#          /etc/systemd/system/wazuh-agent.service.d/notify.conf
#   sudo systemctl daemon-reload
#
# Idempotente: si el archivo ya tiene OnFailure=, no pasa nada.
# =============================================================================

[Unit]
OnFailure=wazuh-agent-failure-notify.service