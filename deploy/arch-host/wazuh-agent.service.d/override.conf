# =============================================================================
# wazuh-agent override - auto-restart + reconexion automatica al manager
# =============================================================================
# El wazuh-agent que viene en los paquetes de Arch/Manjaro NO tiene Restart=always
# por defecto. Sin esto, si la VM manager se reinicia o cambia de IP, el agente
# queda caido hasta que vos lo toques manualmente. Con este override, systemd
# lo reinicia solo cada 10s hasta que vuelva a estar conectado al manager.
#
# INSTALACION (una sola vez, copiar tal cual):
#   sudo mkdir -p /etc/systemd/system/wazuh-agent.service.d
#   sudo cp deploy/arch-host/wazuh-agent.service.d/override.conf \
#          /etc/systemd/system/wazuh-agent.service.d/override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart wazuh-agent
#
# NOTA: este override vive en el repo pero no toca el unit del paquete.
# El unit sigue siendo propiedad de pacman; nuestro override se mergea encima.
# =============================================================================

[Service]
# Reiniciar siempre que el servicio caiga (incluso codigo 0 si se cerro el socket)
Restart=always
# Esperar 10s entre reintentos para no martillar al manager
RestartSec=10
# Limitar a 5 reintentos en 5 minutos - si no conecta, hay un problema real
# (cambio de IP, manager apagado) y hay que avisar.
StartLimitIntervalSec=300
StartLimitBurst=5
