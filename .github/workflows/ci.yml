name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  relay-tests:
    name: Relay tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install relay
        run: |
          python -m pip install --upgrade pip
          pip install -e ./relay
          pip install pytest
      - name: Run pytest
        env:
          PYTHONPATH: .
        run: pytest tests/ -q

  dashboard-build:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check production scripts
        run: |
          shellcheck -S warning scripts/preflight.sh scripts/install-production.sh \
            scripts/deploy-production.sh scripts/install-manager-side.sh \
            scripts/backup.sh scripts/restore.sh scripts/rollback.sh \
            scripts/healthcheck.sh || true

  docker-build:
    name: Dashboard image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dashboard image
        run: docker build -t wazuh-waha-dashboard:ci ./dashboard
