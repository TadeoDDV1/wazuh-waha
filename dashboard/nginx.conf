# Log SIN query strings: evita que tokens/?api_key= queden en access_log.
# Usa $request_method + $uri (sin $request, que incluye la query).
log_format sanitized '$remote_addr - [$time_local] "$request_method $uri" '
                     '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name localhost;

    # No divulgar la versión de nginx
    server_tokens off;

    access_log /var/log/nginx/access.log sanitized;

    # Límite de body coherente con MAX_BODY_BYTES del relay: nginx corta
    # antes de gastar ancho de banda hacia el backend (por defecto es 1m
    # y solo aplica a rutas proxeadas, no al frontend).
    client_max_body_size 512k;

    # ── Headers de seguridad ────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 'unsafe-inline' en style-src es requerido por los style={{} } de React.
    # connect-src 'self' cubre fetch + EventSource (SSE) mismo origen.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    # HSTS: solo tiene sentido con TLS. Cuando se agregue certificado:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # SSE / API → relay. La autenticación es por cookie de sesión (BFF):
    # el browser nunca manda la API key (ni en headers ni en query params).
    location /api/ {
        proxy_pass http://host.docker.internal:8765/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: sin buffering, keep-alive HTTP/1.1
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # /debug/* exige sesión (verify_api_key en el relay): sin cookie → 401.
    location /debug/ {
        proxy_pass http://host.docker.internal:8765/debug/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Health del relay sin auth (para healthchecks; solo status/version)
    location = /health {
        proxy_pass http://host.docker.internal:8765/health;
        proxy_set_header Host $host;
    }
}
